server:
  forward-headers-strategy: framework
  port: 8100
  tomcat:
    max-swallow-size: 25MB
    max-threads: 200
    max-http-post-size: 15728640  # 15 MB in bytes
  servlet:
    contextPath: /be/app/store
management:
  health:
    elasticsearch:
      enabled: false
  endpoints:
    web:
      base-path: /
      path-mapping.health: /actuator/health
      exposure:
        include: health
    jmx:
      exposure:
        exclude: '*'
async:
  asynctempbaseurl: #http://localhost:9010/be/catalog/topic/industries-topic-metrics
spring:
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  servlet:
    multipart:
      max-file-size: 7MB
      max-request-size: 15MB
  main:
    allow-bean-definition-overriding: true
  application:
    name: pulsesg-task-service
  datasource:
    url: "jdbc:postgresql://pulsesg-uat-pg.cluster-czhtpwpe27xn.us-east-1.rds.amazonaws.com:5432/pulsesg-store-dmo?cachePrepStmts=true&useServerPrepStmts=true&rewriteBatchedStatements=true"
    username: pulsorastoredmo
    password: ${PG_PULSORASTORE_PASSWORD}
    hikari:
      connectionTimeout: 20000
      maximumPoolSize: 20

  jpa:
    generate-ddl: true
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        hbm2dll:
          create_namespaces: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 500
          lob:
            non_contextual_creation: true
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
      indent-output: true

#LOGGING_ROOT: C:/workspace/logs/pulsesg/server
logging:
  level:
    root: INFO
    org.springframework.data.couchbase.repository.query: DEBUG
  io:
    swagger:
      models:
        parameters:
          AbstractSerializableParameter: error
# main:
#   business:
#     uri: /be/task
validations:
  task:
    date-pattern: yyyy-MM-dd HH:mm:ss
    yearmomth: YYYYMM
    htmlTags: <("[^"]*"|'[^']*'|[^'">])*>

# hystrix changes
hystrix:
  command:
    taskService-addNewTask:
      execution:
        isolation:
          thread:
            timeoutInMilliseconds: 30000
      fallback:
        isolation:
          semaphore:
            maxConcurrentRequests: 10
      cicuitBreaker:
        enabled: true
        requestVolumeThreshold: 30
        sleepWindowInMilliseconds: 5000
        errorThresholdPercentage: 90
        forceOpen: false
  threadpool:
    taskService-addNewTask:
      coreSize: 2
      maximumSize: 5
      queueSizeRejectionThreshold: 5
      allowMaximumSizeToDivergeFromCoreSize: true
application:
  bucket:
    name: pulsesg-appstore-management-qa
    tagKey: pulsesg-appstore-management
    flagBucketav: false
http:
  pulsesg:
    main: demo.pulsesg.net