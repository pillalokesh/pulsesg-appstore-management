apiVersion: v1
kind: Service
metadata:
  name: {{ include "appstoremanagement.fullname" . }}
  labels:
    {{- include "appstoremanagement.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8100
      protocol: TCP
      name: http
  selector:
    {{- include "appstoremanagement.selectorLabels" . | nindent 4 }}
